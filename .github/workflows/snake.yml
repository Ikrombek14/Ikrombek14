name: Generate snake animation

on:
  schedule:
    - cron: "0 */6 * * *"   # har 6 soatda yangilanadi
  workflow_dispatch:         # Actions sahifasidan qo'lda ishga tushirish
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate snake and contribution graph
        run: python .github/scripts/generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          RANGE: last-year    # profildagi kalendar; ma'lum yil uchun "2026" deb yozing
          OUT_DIR: dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
